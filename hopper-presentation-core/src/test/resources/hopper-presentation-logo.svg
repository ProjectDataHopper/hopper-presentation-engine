<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 128 128" width="128" height="128" role="img"
     aria-label="Hopper Presentation Engine">
    <defs>
        <linearGradient id="hg" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#0B3D5C"/>
            <stop offset="55%" stop-color="#1565A8"/>
            <stop offset="100%" stop-color="#1AA7C7"/>
        </linearGradient>
        <linearGradient id="accent" x1="0%" y1="100%" x2="100%" y2="0%">
            <stop offset="0%" stop-color="#3DDC97"/>
            <stop offset="100%" stop-color="#1AA7C7"/>
        </linearGradient>
        <!-- SVG 1.1 filter (Batik does not support feDropShadow) -->
        <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
            <feGaussianBlur in="SourceAlpha" stdDeviation="2" result="blur"/>
            <feOffset in="blur" dx="0" dy="2" result="offsetBlur"/>
            <feFlood flood-color="#0B3D5C" flood-opacity="0.25" result="color"/>
            <feComposite in="color" in2="offsetBlur" operator="in" result="shadow"/>
            <feMerge>
                <feMergeNode in="shadow"/>
                <feMergeNode in="SourceGraphic"/>
            </feMerge>
        </filter>
    </defs>
    <!-- Rounded tile -->
    <rect x="8" y="8" width="112" height="112" rx="24" fill="url(#hg)" filter="url(#soft)"/>
    <!-- Hopper funnel (data in) -->
    <path d="M34 28 h60 l-10 22 h-40 z" fill="#E8F4FC" opacity="0.95"/>
    <path d="M44 50 h40 l-8 18 h-24 z" fill="#B8E0F0"/>
    <rect x="54" y="68" width="20" height="10" rx="2" fill="#7CC8E0"/>
    <!-- Presentation canvas / chart -->
    <rect x="30" y="82" width="68" height="28" rx="4" fill="#F7FBFE" opacity="0.95"/>
    <!-- Mini bar chart -->
    <rect x="40" y="94" width="8" height="10" rx="1" fill="url(#accent)"/>
    <rect x="52" y="90" width="8" height="14" rx="1" fill="url(#accent)"/>
    <rect x="64" y="86" width="8" height="18" rx="1" fill="url(#accent)"/>
    <rect x="76" y="92" width="8" height="12" rx="1" fill="url(#accent)"/>
    <!-- H monogram accent -->
    <text x="98" y="40" font-family="system-ui,Segoe UI,sans-serif"
          font-size="18" font-weight="700" fill="#E8F4FC"
          opacity="0.85">H
    </text>
</svg>
