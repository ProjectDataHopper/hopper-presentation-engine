name: Trigger Jenkins Build

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  trigger:
    name: Trigger Jenkins Pipeline
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Build
        run: |
          # Query Jenkins and capture HTTP status code
          HTTP_STATUS=$(curl -s -o response.txt -w "%{http_code}" -X POST \
            -u "${{ secrets.JENKINS_USER }}:${{ secrets.JENKINS_API_TOKEN }}" \
            "https://jenkins.data-hopper.com/job/hopper-presentation-engine/build")

          echo "Jenkins returned HTTP status: $HTTP_STATUS"
          if [ -s response.txt ]; then
            cat response.txt
            echo ""
          fi

          # Jenkins returns 201 Created when a build is queued successfully
          if [ "$HTTP_STATUS" -eq 201 ] || [ "$HTTP_STATUS" -eq 200 ]; then
            echo "Build triggered successfully!"
          else
            echo "Failed to trigger build. Check HTTP status above."
            exit 1
          fi
