<html xmlns="http://www.w3.org/1999/html" lang="en">
<head>
    <meta charset="utf-8">
    <script>
    (function () {
      try {
        var p = localStorage.getItem("hopperColorMode") || "system";
        var dark = p === "dark" || (p === "system" && window.matchMedia
          && window.matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.setAttribute("data-theme", dark ? "dark" : "light");
        document.documentElement.setAttribute("data-theme-pref", p);
      } catch (e) { /* ignore */ }
    })();
    </script>
    <link rel="icon" href="/hopper/api/static/images/hopper-presentation-logo.svg" type="image/svg+xml">
    <link rel="stylesheet" type="text/css" href="/hopper/api/static/hopper-theme-tokens.css">
    <link rel="stylesheet" type="text/css" href="/hopper/api/static/hopper-presentation.css">
    <script src="/hopper/api/static/hopper-theme.js" charset="utf-8"></script>
    <script src="/hopper/api/static/jquery.min.js" charset="utf-8"></script>
    <script src="/hopper/api/static/hopper-auth.js" charset="utf-8"></script>
    <title>%PRESENTATION_NAME% (view) page %PAGE_NUMBER%/%PAGE_COUNT%</title>
</head>
<body class="hopper-mode-view%CONTINUOUS_BODY_CLASS%">
<!-- View mode: read-only canvas. No structural editing. Continuous: scroll shell + native scrollbar. -->
<div id="presentationTitleBar" class="presentation-title-bar presentation-title-bar-view" aria-label="Presentation">
    <span id="presentationTitleLink" class="presentation-title-text">%PRESENTATION_NAME%</span>
    <span id="hopperAuthUser"></span>
</div>
<div id="viewScrollShell" class="hopper-view-scroll-shell">
    <div id="continuousStickyChrome" class="hopper-continuous-sticky-chrome" hidden>
        <canvas id="stickyToolbarCanvas" width="100" height="28" aria-label="Toolbar"></canvas>
    </div>
    <canvas
            id="svgCanvas"
            width="100%"
            height="100%"
    ></canvas>
</div>
<script>
    // These constants are globally replaced in the REST service /hopper/api/render/page/
    //
    var hopperMode = 'view';
    var presentationName = '%PRESENTATION_NAME%';
    var renderId = '%RENDER_ID%';
    var renderPageNumber = '%PAGE_NUMBER%';
    var renderPageNumber0 = '%PAGE_NUMBER_0%';
    var renderPageCount = '%PAGE_COUNT%';
    var parameterValues = JSON.parse('%PARAMETER_VALUES%');
    var autoRefreshSeconds = parseInt('%AUTO_REFRESH_SECONDS%', 10) || 0;
    var pagesTruncated = ('%PAGES_TRUNCATED%' === 'true');
    var continuousScroll = ('%CONTINUOUS_SCROLL%' === 'true');
    var layoutMode = '%LAYOUT_MODE%';
    var contentWidth = parseInt('%CONTENT_WIDTH%', 10) || 0;
    var contentHeight = parseInt('%CONTENT_HEIGHT%', 10) || 0;
    var contentTruncated = ('%CONTENT_TRUNCATED%' === 'true');
    // Continuous: if the open URL lacks a usable viewportWidth, rewrite once with the layout
    // viewport (documentElement.clientWidth — same formula as measureContinuousViewportWidth).
    // Do NOT set reload=true (connector cache can be reused for width-only re-layout).
    // Home/editor should already pass viewportWidth so this path is a rare fallback.
    (function () {
        if (!continuousScroll) {
            return;
        }
        try {
            var q = new URLSearchParams(window.location.search || "");
            var have = parseInt(q.get("viewportWidth") || "0", 10) || 0;
            // Match JS measureContinuousViewportWidth fallback (no -16 fudge)
            var want = Math.max(320, Math.floor(
                (document.documentElement && document.documentElement.clientWidth)
                    || window.innerWidth
                    || 1200));
            // 48px threshold matches CONTINUOUS_VIEWPORT_RESIZE_THRESHOLD_PX (scrollbar-safe)
            if (!have || Math.abs(want - have) >= 48) {
                q.set("viewportWidth", String(want));
                q.set("layoutMode", "continuous");
                // Width-only correction: keep connector disk cache (no reload=true)
                q.delete("reload");
                var next = window.location.pathname + "?" + q.toString();
                var cur = window.location.pathname + (window.location.search || "");
                if (next !== cur) {
                    window.location.replace(next);
                }
            }
        } catch (e) { /* ignore; softReloadView in hopper-presentation.js is fallback */ }
    })();
</script>
<script src="/hopper/api/static/hopper-metadata-list.js" charset="utf-8"></script>
<script src="/hopper/api/static/hopper-presentation.js" charset="utf-8"></script>
<script src="/hopper/api/static/hopper-chain-edit.js" charset="utf-8"></script>
<script src="/hopper/api/static/hopper-view.js" charset="utf-8"></script>
<script>window.HAuth && window.HAuth.init({ requireAuth: false });</script>
</body>
</html>
