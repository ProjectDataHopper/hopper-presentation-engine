<html xmlns="http://www.w3.org/1999/html" lang="en">
<head>
    <meta charset="utf-8">
    <script>
    (function () {
      try {
        var p = localStorage.getItem("hopperColorMode") || "system";
        var dark = p === "dark" || (p === "system" && window.matchMedia
          && window.matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.setAttribute("data-theme", dark ? "dark" : "light");
        document.documentElement.setAttribute("data-theme-pref", p);
      } catch (e) { /* ignore */ }
    })();
    </script>
    <link rel="icon" href="/hopper/api/static/images/hopper-presentation-logo.svg" type="image/svg+xml">
    <link rel="stylesheet" type="text/css" href="/hopper/api/static/hopper-theme-tokens.css">
    <link rel="stylesheet" type="text/css" href="/hopper/api/static/hopper-presentation.css">
    <script src="/hopper/api/static/hopper-theme.js" charset="utf-8"></script>
    <script src="/hopper/api/static/jquery.min.js" charset="utf-8"></script>
    <script src="/hopper/api/static/hopper-auth.js" charset="utf-8"></script>
    <title>%PRESENTATION_NAME% (edit) page %PAGE_NUMBER%/%PAGE_COUNT%</title>
</head>
<body class="hopper-mode-edit%CONTINUOUS_BODY_CLASS%">
<div id="presentationTitleBar" class="presentation-title-bar" aria-label="Presentation">
    <a href="#" id="presentationTitleLink" class="presentation-title-link"
       title="Edit presentation properties">%PRESENTATION_NAME%</a>
    <span id="hopperAuthUser"></span>
</div>
<div class="editor-layout">
    <aside class="editor-left-rail" id="editorLeftRail">
        <section class="editor-palette" id="editorPalette">
            <h3>Components</h3>
            <p class="editor-hint">Drag a type onto the page.</p>
            <div id="componentPalette" class="component-palette"></div>
        </section>
        <section class="editor-layout-problems" id="editorLayoutProblems" hidden>
            <h3>Layout problems</h3>
            <p class="editor-hint">Components that could not be placed or drawn. Click a name to edit.</p>
            <ul id="layoutProblemList" class="layout-problem-list" aria-label="Components with layout problems"></ul>
        </section>
    </aside>
    <main class="editor-main">
        <div id="viewScrollShell" class="hopper-view-scroll-shell hopper-editor-scroll-shell">
            <div id="continuousStickyChrome" class="hopper-continuous-sticky-chrome" hidden>
                <canvas id="stickyToolbarCanvas" width="100" height="28" aria-label="Toolbar"></canvas>
            </div>
            <canvas id="svgCanvas" width="100%" height="100%"></canvas>
        </div>
    </main>
</div>

<div id="editSidePanel" class="sidePanel property-side-panel">
    <div class="property-editor-shell">
        <div class="property-form-column">
            <div id="editArea" class="property-form-area"></div>
        </div>
        <div class="property-preview-column" id="propertyPreviewColumn" hidden>
            <div class="property-preview-header">Component preview</div>
            <div class="property-preview-frame" id="componentPreviewFrame">
                <img id="componentPreviewImg" class="property-preview-img" alt="Component preview">
                <p class="property-preview-empty" id="componentPreviewEmpty">No preview</p>
            </div>
            <p class="property-preview-meta" id="componentPreviewMeta"></p>
        </div>
    </div>
</div>

<script>
    // Globally replaced by the REST service when opening the editor
    //
    // var (not const) so soft re-render can update renderId / page counts in-place
    var hopperMode = 'edit';
    var presentationName = '%PRESENTATION_NAME%';
    var renderId = '%RENDER_ID%';
    var renderPageNumber = '%PAGE_NUMBER%';
    var renderPageNumber0 = '%PAGE_NUMBER_0%';
    var renderPageCount = '%PAGE_COUNT%';
    var parameterValues = JSON.parse('%PARAMETER_VALUES%');
    var hopperTimingsToolbarVisible = ('%TIMINGS_TOOLBAR_VISIBLE%' !== 'false');
    var pagesTruncated = ('%PAGES_TRUNCATED%' === 'true');
    var continuousScroll = ('%CONTINUOUS_SCROLL%' === 'true');
    var layoutMode = '%LAYOUT_MODE%';
    var contentWidth = parseInt('%CONTENT_WIDTH%', 10) || 0;
    var contentHeight = parseInt('%CONTENT_HEIGHT%', 10) || 0;
    var contentTruncated = ('%CONTENT_TRUNCATED%' === 'true');
</script>
<script src="/hopper/api/static/hopper-metadata-list.js" charset="utf-8"></script>
<script src="/hopper/api/static/hopper-hop-browser.js" charset="utf-8"></script>
<script src="/hopper/api/static/hopper-presentation.js" charset="utf-8"></script>
<script src="/hopper/api/static/hopper-chain-edit.js" charset="utf-8"></script>
<script src="/hopper/api/static/hopper-edit.js" charset="utf-8"></script>
<script>window.HAuth && window.HAuth.init({ requireAuth: false });</script>
</body>
</html>
