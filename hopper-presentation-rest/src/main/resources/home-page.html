<html lang="en">
<head>
    <meta charset="utf-8">
    <script>
    (function () {
      try {
        var p = localStorage.getItem("hopperColorMode") || "system";
        var dark = p === "dark" || (p === "system" && window.matchMedia
          && window.matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.setAttribute("data-theme", dark ? "dark" : "light");
        document.documentElement.setAttribute("data-theme-pref", p);
      } catch (e) { /* ignore */ }
    })();
    </script>
    <title>Data Hopper — presentations</title>
    <link rel="icon" href="/hopper/api/static/images/hopper-presentation-logo.svg" type="image/svg+xml">
    <link rel="stylesheet" type="text/css" href="/hopper/api/static/hopper-theme-tokens.css">
    <link rel="stylesheet" type="text/css" href="/hopper/api/static/hopper-presentation.css">
    <script src="/hopper/api/static/hopper-theme.js"></script>
    <script src="/hopper/api/static/jquery.min.js"></script>
    <script src="/hopper/api/static/hopper-auth.js"></script>
    <script src="/hopper/api/static/hopper-metadata-list.js"></script>
</head>
<body class="home-page">
<header class="home-header">
    <div style="display:flex;align-items:flex-start;gap:1rem;flex-wrap:wrap">
        <div style="flex:1">
            <h1>Data Hopper presentations</h1>
            <p class="home-sub">View a rendered presentation, or open the WYSIWYG editor.</p>
        </div>
        <div style="margin-top:0.35rem;display:flex;align-items:center;gap:0.5rem;flex-wrap:wrap">
            <span id="hopperThemeToggleHost"></span>
            <div id="hopperAuthUser"></div>
        </div>
    </div>
</header>

<div class="home-actions">
    <button type="button" id="btnNewPresentation" class="home-btn home-btn-primary">New presentation</button>
    <a class="home-btn" href="/hopper/api/static/admin/" style="margin-left:0.5rem" id="linkAdmin">Administration</a>
    <a class="home-btn" href="/hopper/api/static/admin-usage.html" style="margin-left:0.5rem">Live usage</a>
</div>

<div class="home-meta-list" id="presentationListRoot">
    <p class="editor-hint">Loading…</p>
</div>

<script>
    const API_BASE = '/hopper/api/';
    const ML = window.HMetadataList;

    let presentationSummaryRows = [];

    /** Wait cursor until navigation replaces the page (open / edit can take seconds). */
    function setHomeBusy(busy) {
        try {
            if (busy) {
                document.body.classList.add('hopper-busy');
                document.body.style.cursor = 'wait';
            } else {
                document.body.classList.remove('hopper-busy');
                document.body.style.cursor = '';
            }
        } catch (e) { /* ignore */ }
    }

    $(document).ready(function () {
        if (window.HThemeMode) {
            window.HThemeMode.installToggle(document.getElementById('hopperThemeToggleHost'));
        }
        window.HAuth.init({ requireAuth: false }).then(function () {
            // When auth is on, require a session before listing metadata
            if (window.HAuth.state.config && window.HAuth.state.config.authEnabled
                && !(window.HAuth.state.me && window.HAuth.state.me.authenticated)) {
                window.location.href = window.HAuth.loginUrl();
                return;
            }
            loadPresentationList();
        });
        $('#btnDemo').on('click', function () {
            openView('list-presentations');
        });
        $('#btnNewPresentation').on('click', function () {
            createNewPresentation();
        });
    });

    function presentationListOptions(filterQuery) {
        return {
            rows: presentationSummaryRows,
            filterQuery: filterQuery || '',
            listId: 'homePresentationTable',
            emptyMessage: 'No presentations found.',
            iconForRow: function () {
                return {
                    url: ML.staticImage('presentation.svg'),
                    title: 'Presentation'
                };
            },
            actions: [
                {
                    id: 'copy',
                    iconUrl: ML.staticImage('copy.svg'),
                    title: 'Copy as…'
                },
                {
                    id: 'edit',
                    iconUrl: ML.staticImage('edit.svg'),
                    title: 'Edit presentation'
                },
                {
                    id: 'delete',
                    iconUrl: ML.staticImage('delete.svg'),
                    title: 'Delete presentation'
                }
            ]
        };
    }

    function renderPresentationListBody(filterQuery) {
        let body = document.getElementById('metaListBody');
        if (!body) {
            return;
        }
        body.innerHTML = ML.buildMetadataListTableHtml(presentationListOptions(filterQuery));
    }

    function loadPresentationList() {
        let root = document.getElementById('presentationListRoot');
        ML.fetchMetadataSummary('presentation', function (rows) {
            presentationSummaryRows = rows || [];
            let html = ML.buildMetadataListPanelHtml(Object.assign({
                title: '',
                hint: '',
                filterId: 'homePresentationFilter',
                bodyId: 'metaListBody',
                filterPlaceholder: 'Filter by name, description, or path…'
            }, presentationListOptions('')));
            root.innerHTML = html;

            let byName = ML.rowsByNameMap(presentationSummaryRows);
            ML.bindMetadataListHandlers(root, {
                primary: function (name) {
                    openView(name);
                },
                copy: function (name) {
                    ML.copyMetadataAs('presentation', name, {
                        existingRows: presentationSummaryRows,
                        onSuccess: function () {
                            loadPresentationList();
                        }
                    });
                },
                edit: function (name) {
                    openEdit(name);
                },
                delete: function (name) {
                    deletePresentation(name);
                }
            }, byName);

            let filterEl = document.getElementById('homePresentationFilter');
            let bodyEl = document.getElementById('metaListBody');
            ML.bindMetadataListFilter(filterEl, bodyEl, function (q) {
                return presentationListOptions(q);
            });
            // Re-bind is not needed: handlers are on root, re-rendered rows keep data-meta-* attributes
        });
    }

    function openView(presentationName) {
        setHomeBusy(true);
        let colorMode = (window.HThemeMode && window.HThemeMode.getResolvedMode)
            ? window.HThemeMode.getResolvedMode() : 'light';
        // Name-based URL: server resolves/rebuilds a session-owned rendering (survives restart)
        window.open(
            API_BASE + 'render/p/' + encodeURIComponent(presentationName)
                + '/HTML/0/?colorMode=' + encodeURIComponent(colorMode),
            '_self'
        );
    }

    function openEdit(presentationName) {
        setHomeBusy(true);
        let colorMode = (window.HThemeMode && window.HThemeMode.getResolvedMode)
            ? window.HThemeMode.getResolvedMode() : 'light';
        window.open(
            API_BASE + 'edit/presentation/' + encodeURIComponent(presentationName)
                + '/?colorMode=' + encodeURIComponent(colorMode),
            '_self'
        );
    }

    function deletePresentation(name) {
        if (!name) {
            return;
        }
        let ok = window.confirm(
            'Delete presentation "' + name + '"?\n\nThis cannot be undone.'
        );
        if (!ok) {
            return;
        }
        $.ajax({
            url: API_BASE + 'metadata/presentation/' + encodeURIComponent(name),
            type: 'DELETE',
            dataType: 'text',
            success: function () {
                loadPresentationList();
            },
            error: function (xhr, status, error) {
                if (typeof showAjaxError === 'function') {
                    showAjaxError('Failed to delete presentation "' + name + '"', xhr, status, error);
                } else if (ML && typeof ML.showAjaxError === 'function') {
                    ML.showAjaxError('Failed to delete presentation "' + name + '"', xhr, status, error);
                } else {
                    alert('Failed to delete presentation: '
                        + ((xhr && xhr.responseText) ? xhr.responseText : xhr.status));
                }
            }
        });
    }

    function createNewPresentation() {
        let name = prompt('Name for the new presentation:', 'My Presentation');
        if (name === null) {
            return;
        }
        name = String(name).trim();
        if (!name) {
            alert('Name is required');
            return;
        }
        setHomeBusy(true);
        $.ajax({
            url: API_BASE + 'edit/presentation/create/',
            type: 'POST',
            contentType: 'application/json; charset=utf-8',
            data: JSON.stringify({
                name: name,
                description: '',
                width: 1123,
                height: 794,
                margin: 25,
                defaultThemeName: 'Default'
            }),
            dataType: 'text',
            success: function (savedName) {
                // openEdit also sets busy (navigation); leave wait cursor on
                openEdit(savedName || name);
            },
            error: function (xhr) {
                setHomeBusy(false);
                alert('Could not create presentation: ' + (xhr.responseText || xhr.status));
            }
        });
    }
</script>
</body>
</html>
