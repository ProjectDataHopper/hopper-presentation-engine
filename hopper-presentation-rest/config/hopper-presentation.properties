metadata.path = config/metadata

# Bootstrap (L0) configuration. Runtime overrides from the admin panel are stored
# in metadata as server-settings/runtime and merge on top of this file.
# Secrets should be ${ENV_VAR} references, not raw values.
# Admin API: GET/POST /api/admin/settings (requires security.admin).

# Authentication (default: open API for local demos)
# auth.enabled=true
# auth.mode=static-dev
# auth.dev.user=admin
# auth.dev.roles=ADMIN
# authz.default-deny-resources=false
#
# OAuth2 / OIDC resource server (JWT Bearer)
# auth.enabled=true
# auth.mode=oauth2
# auth.issuer-uri=https://idp.example.com/realms/hopper
# auth.jwks-uri=
# auth.audience=hopper-presentation
# auth.username-claim=preferred_username
# auth.roles-claim=realm_access.roles
# auth.roles-claim-prefix=
# auth.required-scopes=
# auth.clock-skew-seconds=60
# auth.jwt.hmac-secret=   # dev/test only
# Browser OIDC PKCE (Phase 7)
# auth.oidc.client-id=hopper-ui
# auth.oidc.client-secret=
# auth.oidc.redirect-uri=http://localhost:8080/hopper/api/auth/callback
# auth.oidc.scopes=openid profile email
# auth.session.cookie-name=HOPPER_SESSION
# auth.session.ttl-minutes=480
# auth.session.cookie-secure=false

# Map Ship/Harbor Keycloak roles → Hopper roles (Data Hopper fleet SSO)
# auth.role-aliases=viewer:VIEWER,operator:AUTHOR,admin:ADMIN

# Server ops (also editable in admin Settings / Server tabs)
# server.render.ttl-minutes=60
# server.render.max-entries=200
# server.session.sweep-interval-seconds=60
# server.cache.enabled=true

# Audit
# audit.enabled=true
# audit.fail-open=true
# audit.async=true
# audit.queue.size=10000
# audit.queue.full-policy=drop
# audit.redact.parameter-values=false
# audit.redact.parameter-names=ssn,email,password,secret
# audit.include.sql-text=true
# audit.bootstrap.logging=true
# audit.bootstrap.jsonl.path=${java.io.tmpdir}/hopper-audit.jsonl

