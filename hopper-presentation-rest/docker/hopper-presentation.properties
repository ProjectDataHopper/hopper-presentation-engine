#
# Docker / Ship-stack sample configuration for hopper-presentation-rest.
# Mount or bake this file at HOPPER_REST_CONFIG_PATH (default /config).
#

metadata.path=/hopper-data/metadata
# Presentation working data (connector disk cache, timings); default sibling data/ if empty
# server.data.path=/hopper-data/data
# server.timings.capture=false
# ui.toolbar.timings-visible=true
cors.allow.origin=true

# Ops dashboards: Ship API base for ${HOPPER_SHIP_API_URL} in REST connectors
# (also set via container env HOPPER_SHIP_API_URL)


# ── Auth: Data Hopper Keycloak (shared with Ship / Harbor / Frontend) ──
# Enable after Keycloak is up; for open local smoke leave disabled.
# auth.enabled=true
# auth.mode=oauth2
# auth.issuer-uri=http://keycloak:8080/realms/hopper
# auth.audience=hopper-presentation
# auth.username-claim=preferred_username
# auth.email-claim=email
# auth.roles-claim=realm_access.roles
# auth.role-aliases=viewer:VIEWER,operator:AUTHOR,admin:ADMIN
# auth.default-roles=VIEWER
# auth.oidc.client-id=hopper-ui
# auth.oidc.client-secret=
# auth.oidc.redirect-uri=http://localhost:8088/hopper/api/auth/callback
# auth.oidc.scopes=openid profile email
# auth.session.cookie-name=HOPPER_SESSION
# auth.session.ttl-minutes=480
# auth.session.cookie-secure=false

# Server ops
server.render.ttl-minutes=60
server.render.max-entries=200
server.session.sweep-interval-seconds=60

# Audit
audit.enabled=true
audit.fail-open=true
audit.bootstrap.logging=true
